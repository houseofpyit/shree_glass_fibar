version: "3.8"

# Production Docker Compose - Use with: docker compose -f docker-compose.yml -f docker/docker-compose.prod.yml up -d

services:
  app:
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M

  db:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M

  redis:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
